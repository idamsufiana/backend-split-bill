services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      GITHUB_USERNAME: ${GITHUB_USERNAME:-idamsufiana}
      CACHE_TYPE: redis
      REDIS_HOST: redis
    volumes:
      - h2_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  h2_data:

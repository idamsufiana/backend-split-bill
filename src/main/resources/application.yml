app:
  # How long a cached settlement / category summary may live (writes evict immediately anyway).
  cache-ttl: ${CACHE_TTL:PT10M}
  github-username: idamsufiana

spring:
  application:
    name: settleup
  datasource:
    # LOCK_TIMEOUT: how long a write waits for another write's pessimistic lock on the same group.
    url: jdbc:h2:file:./data/settleup;LOCK_TIMEOUT=5000
    username: sa
    password: ""
  h2:
    console:
      # Browse the tables at http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./data/settleup, user: sa)
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  cache:
    # Off by default so the app needs nothing else running. Set CACHE_TYPE=redis to enable.
    type: ${CACHE_TYPE:none}
  data:
    redis:
      # Redis is only a cache here, not a repository store.
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081